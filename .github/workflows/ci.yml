name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: knowledge_platform
          POSTGRES_USER: app_user
          POSTGRES_PASSWORD: local_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app_user -d knowledge_platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      APP_ENV: test
      RAG_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API dependencies
        working-directory: apps/api
        run: pip install -e ".[dev]"
      - name: Lint API
        working-directory: apps/api
        run: ruff check .
      - name: Scan repository secrets
        run: python apps/api/scripts/scan_secrets.py
      - name: Run migrations
        working-directory: apps/api
        run: DATABASE_URL="postgresql+psycopg://app_user:$POSTGRES_PASSWORD@localhost:5432/knowledge_platform" JWT_SECRET="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')" alembic upgrade head
        env:
          POSTGRES_PASSWORD: local_password
      - name: Run API tests
        working-directory: apps/api
        run: DATABASE_URL="postgresql+psycopg://app_user:$POSTGRES_PASSWORD@localhost:5432/knowledge_platform" JWT_SECRET="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')" pytest
        env:
          POSTGRES_PASSWORD: local_password
      - name: Verify migration downgrade policy
        working-directory: apps/api
        run: DATABASE_URL="postgresql+psycopg://app_user:$POSTGRES_PASSWORD@localhost:5432/knowledge_platform" JWT_SECRET="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')" alembic downgrade base && DATABASE_URL="postgresql+psycopg://app_user:$POSTGRES_PASSWORD@localhost:5432/knowledge_platform" JWT_SECRET="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')" alembic upgrade head
        env:
          POSTGRES_PASSWORD: local_password
      - name: Run seed skeleton
        working-directory: apps/api
        run: DATABASE_URL="postgresql+psycopg://app_user:$POSTGRES_PASSWORD@localhost:5432/knowledge_platform" JWT_SECRET="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')" python scripts/seed_dev.py
        env:
          POSTGRES_PASSWORD: local_password

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install web dependencies
        working-directory: apps/web
        run: npm install
      - name: Typecheck web
        working-directory: apps/web
        run: npm run typecheck
      - name: Test web
        working-directory: apps/web
        run: npm test
      - name: Build web
        working-directory: apps/web
        run: npm run build
